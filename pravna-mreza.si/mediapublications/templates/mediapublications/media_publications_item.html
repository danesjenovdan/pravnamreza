<div class="media-publication-item">
    <article class="row news-preview">
        <div class="col-12">
            <div>
                <h2 class="news-title mt-0"><a href="{{ item.url }}" target="_blank">{{ item.title }}</a></h2>
                <div class="news-subtitle">
                    <span>{{ item.source }}</span> | <time>{{ item.date|date:'d. m. Y' }}</time>
                </div>
            </div>
        </div>
    </article>
    <hr class="short">
</div>
